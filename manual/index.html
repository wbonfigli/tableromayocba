<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Sistema Mayo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="btn-menu-mobile" id="btnMenuMobile">☰</button>

<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-box">MAYO</span>
            <h1>Manual del Sistema</h1>
        </div>
        <div class="sidebar-search">
            <input type="text" id="buscador" placeholder="Buscar módulo...">
        </div>
        <nav class="sidebar-nav" id="navMenu"></nav>
    </aside>

    <main class="contenido" id="contenido"></main>
</div>

<script src="content.js"></script>
<script>
const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

let moduloActual = null;
let modoActual = 'operativo'; // por defecto se abre en modo Operativo

// ---------------------------------------------------------------------
// Sidebar
// ---------------------------------------------------------------------
function renderSidebar(filtro) {
    const nav = $('#navMenu');
    nav.innerHTML = '';
    const f = (filtro || '').toLowerCase().trim();

    CONTENIDO.categorias.forEach(cat => {
        const mods = CONTENIDO.modulos.filter(m =>
            m.categoria === cat &&
            (!f || m.nombre.toLowerCase().includes(f) || m.resumen.toLowerCase().includes(f))
        );
        if (!mods.length) return;

        const catEl = document.createElement('div');
        catEl.className = 'nav-categoria';
        catEl.textContent = cat;
        nav.appendChild(catEl);

        mods.forEach(m => {
            const item = document.createElement('div');
            item.className = 'nav-item' + (moduloActual === m.id ? ' activo' : '');
            const dotClass = m.estado === 'activo' ? 'dot-activo' : (m.estado === 'parcial' ? 'dot-parcial' : 'dot-pendiente');
            item.innerHTML = '<span class="dot ' + dotClass + '"></span><span>' + m.nombre + '</span>';
            item.onclick = () => { location.hash = m.id; cerrarMenuMobile(); };
            nav.appendChild(item);
        });
    });
}

$('#buscador').addEventListener('input', e => renderSidebar(e.target.value));

// ---------------------------------------------------------------------
// Home
// ---------------------------------------------------------------------
function renderHome() {
    let html = '<div class="crumb">MANUAL / INICIO</div>';
    html += '<h2 style="font-size:30px;margin:0 0 6px;">Manual del Sistema Mayo</h2>';
    html += '<p class="page-subtitle">Referencia técnica y operativa de cada módulo. Elegí uno del menú, o desde las tarjetas de abajo.</p>';

    html += '<div class="callout callout-info">Cada módulo tiene dos vistas: <b>Técnico</b> (arquitectura, columnas, funciones — para quien mantiene el código) y <b>Operativo</b> (paso a paso de uso — para quien trabaja con la pantalla todos los días). El punto de color junto a cada nombre indica si el módulo está <span style="color:#86efac">● activo</span>, <span style="color:#fde68a">● parcialmente documentado</span> o <span style="color:#5b6b85">● pendiente</span>.</div>';

    CONTENIDO.categorias.forEach(cat => {
        const mods = CONTENIDO.modulos.filter(m => m.categoria === cat);
        if (!mods.length) return;
        html += '<div class="bloque"><h3>' + cat + '</h3><div class="grid-modulos">';
        mods.forEach(m => {
            html += '<div class="tarjeta-modulo" onclick="location.hash=\'' + m.id + '\'">' +
                '<div class="cat">' + estadoTexto(m.estado) + '</div>' +
                '<h4>' + m.nombre + '</h4>' +
                '<p>' + m.resumen + '</p>' +
                '</div>';
        });
        html += '</div></div>';
    });

    html += '<footer class="wiki-footer">Sistema Mayo Transformadores S.R.L. · Manual generado y mantenido junto con Claude · Última revisión: 12/08/2026</footer>';

    $('#contenido').innerHTML = html;
}

function estadoTexto(estado) {
    return estado === 'activo' ? 'MÓDULO ACTIVO' : (estado === 'parcial' ? 'DOCUMENTACIÓN PARCIAL' : 'PENDIENTE');
}

// ---------------------------------------------------------------------
// Página de módulo
// ---------------------------------------------------------------------
function renderModulo(id) {
    const m = CONTENIDO.modulos.find(x => x.id === id);
    if (!m) { renderHome(); return; }
    moduloActual = id;

    const badgeClass = m.estado === 'activo' ? 'badge-activo' : (m.estado === 'parcial' ? 'badge-parcial' : 'badge-pendiente');

    let html = '<div class="crumb">MANUAL / ' + m.categoria.toUpperCase() + '</div>';
    html += '<div class="page-header"><div><h2>' + m.nombre + '</h2>';
    html += '<p class="page-subtitle">' + m.resumen + '</p></div>';
    html += '<span class="badge-estado ' + badgeClass + '">' + estadoTexto(m.estado) + '</span></div>';

    html += '<div class="modo-switch ' + (modoActual === 'tecnico' ? 'tec' : 'op') + '" id="modoSwitch">' +
        '<div class="rail"></div>' +
        '<button data-modo="tecnico" class="' + (modoActual === 'tecnico' ? 'activo' : '') + '">Técnico</button>' +
        '<button data-modo="operativo" class="' + (modoActual === 'operativo' ? 'activo' : '') + '">Operativo</button>' +
        '</div>';

    html += '<div class="panel-contenido" data-modo="' + modoActual + '">' + renderVista(m, modoActual) + '</div>';

    $('#contenido').innerHTML = html;

    $$('#modoSwitch button').forEach(btn => {
        btn.onclick = () => {
            modoActual = btn.dataset.modo;
            renderModulo(id);
            inicializarAcordeon();
        };
    });

    window.scrollTo(0, 0);
}

function renderVista(m, modo) {
    const data = m[modo];
    if (!data || data.pendiente) {
        const nota = data && data.nota ? data.nota : 'Todavía no se relevó esta parte del módulo con suficiente detalle.';
        return '<div class="callout callout-todo">' +
            '<b>⚠ Sección pendiente de completar.</b><br>' + nota +
            '<br><br><small>Para completarla: pegarle a Claude el código real (Código.gs + Index.html) de este módulo, igual que se hizo con RG-CA-03 y NC.</small>' +
            '</div>';
    }

    let html = '';
    if (data.intro) html += '<p>' + data.intro + '</p>';

    if (data.bloques) {
        html += '<div class="acordeon-controles"><button onclick="toggleTodos(true)">Expandir todo</button><button onclick="toggleTodos(false)">Colapsar todo</button></div>';
        data.bloques.forEach((b, i) => {
            html += '<div class="bloque' + (i === 0 ? ' abierto' : '') + '" data-idx="' + i + '">';
            html += '<div class="bloque-header" onclick="toggleBloque(this)"><h3>' + b.titulo + '</h3><span class="bloque-chevron">▶</span></div>';
            html += '<div class="bloque-body">';
            if (b.texto) html += '<p>' + b.texto + '</p>';
            if (b.formula) {
                html += '<div class="formula-box">' + b.formula.texto + '<div class="partes">';
                b.formula.partes.forEach(p => {
                    html += '<div class="parte"><div class="pct">' + p.pct + '</div><div class="lbl">' + p.lbl + '</div></div>';
                });
                html += '</div></div>';
            }
            if (b.textoExtra) html += '<p>' + b.textoExtra + '</p>';
            if (b.tabla) {
                html += '<table class="tabla-cols"><thead><tr><th>Col</th><th>Campo</th><th>Detalle</th></tr></thead><tbody>';
                b.tabla.forEach(fila => {
                    html += '<tr><td>' + fila[0] + '</td><td>' + fila[1] + '</td><td>' + (fila[2] || '') + '</td></tr>';
                });
                html += '</tbody></table>';
            }
            html += '</div></div>';
        });
    }

    if (data.pasos) {
        html += '<div class="bloque"><h3>Paso a paso</h3><ol class="pasos">';
        data.pasos.forEach(p => {
            html += '<li><b>' + p.titulo + '</b><span>' + p.texto + '</span></li>';
        });
        html += '</ol></div>';
    }

    return html;
}

// ---------------------------------------------------------------------
// Acordeón
// ---------------------------------------------------------------------
function toggleBloque(headerEl) {
    const bloque = headerEl.closest('.bloque');
    const abrir = !bloque.classList.contains('abierto');
    setBloqueEstado(bloque, abrir);
}

function setBloqueEstado(bloque, abrir) {
    const body = bloque.querySelector('.bloque-body');
    if (abrir) {
        bloque.classList.add('abierto');
        body.style.maxHeight = body.scrollHeight + 'px';
    } else {
        bloque.classList.remove('abierto');
        body.style.maxHeight = '0px';
    }
}

function toggleTodos(abrir) {
    $$('.bloque').forEach(b => setBloqueEstado(b, abrir));
}

// Recalcula max-height de bloques abiertos si la ventana cambia de tamaño
// (texto puede re-envolver en más/menos líneas y desalinear el alto)
window.addEventListener('resize', () => {
    $$('.bloque.abierto .bloque-body').forEach(body => { body.style.maxHeight = body.scrollHeight + 'px'; });
});

function inicializarAcordeon() {
    $$('.bloque').forEach(b => {
        const body = b.querySelector('.bloque-body');
        if (b.classList.contains('abierto')) {
            body.style.maxHeight = body.scrollHeight + 'px';
        }
    });
}

// ---------------------------------------------------------------------
// Router simple por hash
// ---------------------------------------------------------------------
function router() {
    const hash = location.hash.replace('#', '');
    if (!hash) {
        moduloActual = null;
        renderHome();
    } else {
        renderModulo(hash);
        inicializarAcordeon();
    }
    renderSidebar($('#buscador') ? $('#buscador').value : '');
}

window.addEventListener('hashchange', router);
document.addEventListener('DOMContentLoaded', router);

// ---------------------------------------------------------------------
// Menú mobile
// ---------------------------------------------------------------------
function cerrarMenuMobile() { $('#sidebar').classList.remove('abierto'); }
$('#btnMenuMobile').addEventListener('click', () => $('#sidebar').classList.toggle('abierto'));
</script>
</body>
</html>
